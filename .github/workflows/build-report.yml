name: Build Report

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            poppler-utils \
            python3 \
            python3-pip

      - name: Install Python dependencies
        run: |
          pip install numpy pandas matplotlib

      - name: Build report
        run: make runReport

      - name: Prepare Pages site
        run: |
          mkdir -p _site/report-pages

          cp 27086534RW741assignment3.pdf _site/report.pdf

          pdftoppm \
            -png \
            -r 140 \
            27086534RW741assignment3.pdf \
            _site/report-pages/page

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Machine Learning 741 Assignment 3</title>
            <style>
              body {
                max-width: 1100px;
                margin: 40px auto;
                font-family: sans-serif;
              }

              iframe {
                width: 100%;
                height: 95vh;
                border: none;
              }
            </style>
          </head>
          <body>
            <h1>Machine Learning 741 Assignment 3</h1>
            <p><a href="report.pdf">Open PDF directly</a></p>
            <iframe src="report.pdf"></iframe>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
